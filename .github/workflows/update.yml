name: Update dashboard data

on:
  schedule:
    - cron: '17 0 * * *'   # every day at 06:17 Dhaka time
  workflow_dispatch:        # "Run workflow" button for an instant refresh

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Pull KoboToolbox data and rebuild aggregates
        env:
          KOBO_TOKEN: ${{ secrets.KOBO_TOKEN }}
          KOBO_NORTH_URL: ${{ secrets.KOBO_NORTH_URL }}
          KOBO_SOUTH_URL: ${{ secrets.KOBO_SOUTH_URL }}
        run: |
          mkdir -p ../docs
          python update.py
          cp ../docs/data.json ./data.json
      - name: Publish if anything changed
        run: |
          git config user.name "observatory-bot"
          git config user.email "observatory-bot@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || (git commit -m "Daily data update" && git push)
